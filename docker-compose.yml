# ─────────────────────────────────────────────────────────────────────────
# Compose DEV — infrastructure partagée uniquement (pas les apps).
# Les applications tournent en local via `pnpm dev` et se connectent ici.
#
#   docker compose up -d                 # Postgres
#   docker compose --profile tools up -d # + Adminer (UI DB sur :8080)
#
# La construction/lancement des images d'app en conteneur → docker-compose.prod.yml
# ─────────────────────────────────────────────────────────────────────────
name: daromsart-dev

services:
  postgres:
    image: postgres:16
    container_name: daromsart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow
      POSTGRES_DB: invoiceflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # UI d'administration de la base (optionnelle) : `--profile tools`
  adminer:
    image: adminer:4
    container_name: daromsart-adminer
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

volumes:
  pgdata:
    name: daromsart_pgdata
