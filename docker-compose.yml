services:
  postgres:
    image: postgres:16
    container_name: invoiceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoiceflow
      POSTGRES_PASSWORD: invoiceflow
      POSTGRES_DB: invoiceflow
    ports:
      - "5432:5432"
    volumes:
      - invoiceflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  invoiceflow_pgdata:
