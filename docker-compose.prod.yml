# ─────────────────────────────────────────────────────────────────────────
# Compose PROD-like — construit et lance les apps en conteneur + Postgres.
# Sert de référence de déploiement (VPS/CI) et de test d'intégration des images.
#
#   cp .env.example .env            # renseigner les secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Chaque nouvelle app = un service supplémentaire pointant vers son Dockerfile.
# ─────────────────────────────────────────────────────────────────────────
name: daromsart-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invoiceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invoiceflow}
      POSTGRES_DB: ${POSTGRES_DB:-invoiceflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invoiceflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  invoiceflow-ai:
    build:
      context: .
      dockerfile: apps/invoiceflow-ai/Dockerfile
    image: daromsart/invoiceflow-ai:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # La base est jointe par le nom de service du réseau compose.
      DATABASE_URL: postgresql://${POSTGRES_USER:-invoiceflow}:${POSTGRES_PASSWORD:-invoiceflow}@postgres:5432/${POSTGRES_DB:-invoiceflow}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-Daromsart Système <no-reply@example.com>}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      # Copilote agent — au moins une clé. Vide = désactivé.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # IA locale (Ollama/GPU) via le worker — opt-in (vide = désactivé).
      # Pour l'activer : OLLAMA_WORKER_URL=http://python-worker:8000 (nom du
      # service sur le réseau compose) + un Ollama joignable côté worker (ci-dessous).
      OLLAMA_WORKER_URL: ${OLLAMA_WORKER_URL:-}
      # Compte administrateur créé automatiquement au premier démarrage
      # (migrations + bootstrap, voir `src/instrumentation.ts`) — sans effet
      # si un administrateur existe déjà (idempotent, y compris après un
      # redémarrage/upgrade).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me}
    ports:
      - "3000:3000"
    volumes:
      # Fichiers uploadés (logos) + PDF/emails générés en STORAGE_DRIVER=fs —
      # doit survivre à un `--build`/recreate, pas seulement à un restart.
      - invoiceflow_storage:/app/.storage

  # Worker Python de référence (voir services/python-worker). Appelable :
  #   - depuis un autre conteneur du réseau compose : http://python-worker:8000
  #   - depuis l'extérieur (hôte/Internet)          : http://<hôte>:8000
  # Chaque nouveau worker Python = un service supplémentaire du même type.
  python-worker:
    build:
      context: .
      dockerfile: services/python-worker/Dockerfile
    image: daromsart/python-worker:latest
    restart: unless-stopped
    environment:
      # Toujours renseigner en prod — sans elle, l'API accepte les appels
      # sans authentification (voir services/python-worker/app/security.py).
      WORKER_API_KEY: ${WORKER_API_KEY:-change-me}
      # IA locale : Ollama tourne sur l'HÔTE (accès GPU natif), le worker le
      # relaie via la passerelle host. Ne concerne que si OLLAMA_WORKER_URL est activé.
      WORKER_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      # Permet au conteneur d'atteindre l'Ollama de l'hôte (Linux).
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

volumes:
  pgdata:
    name: daromsart_prod_pgdata
  invoiceflow_storage:
    name: daromsart_prod_invoiceflow_storage
