[project]
name = "python-worker"
version = "0.1.0"
description = "Worker Python (FastAPI) — modèle de service backend du monorepo daromsart_agency."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.31,<0.32",
  "pydantic-settings>=2.5,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<0.28", "ruff>=0.6,<0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Application, pas une librairie publiée : uv ne doit pas essayer de
# construire/installer ce projet lui-même, seulement ses dépendances.
package = false
